    <meta property="og:description" content="phần mềm quản trị Erp" />

    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKffuRSheGugfycCmEm46856oXbHMXKHiOjg&s" />
    <link rel="apple-touch-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKffuRSheGugfycCmEm46856oXbHMXKHiOjg&s" />
    
    <!-- Default font (Be Vietnam Pro) + Noto Sans fallback – other fonts lazy-loaded on demand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/theme-boot.js"></script>
    <!-- Chế độ tối, cỡ chữ, màu chủ đạo, font — áp từ localStorage trước React (giảm nháy). Dữ liệu: public/theme-boot.js ↔ lib/theme/tokens.ts -->
    <script>
      (function() {
        var boot = window.__MANGIICO_THEME_BOOT__ || {};
        var SANS_FALLBACK = "'Noto Sans', ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'";
        var GOOGLE_FONT_PARAM = boot.GOOGLE_FONT_PARAM || {};
        var colorMap = boot.PRIMARY_COLOR_MAP || {};
        var defaultFont = boot.DEFAULT_FONT || 'Be Vietnam Pro';
        function quoteFontName(name) {
          name = (name || '').trim();
          return name.indexOf(' ') >= 0 ? "'" + name + "'" : name;
        }
        function applyFontFromState(state) {
          var el = document.documentElement;
          var ff = state && state.fontFamily;
          if (!ff || !(ff in GOOGLE_FONT_PARAM)) ff = defaultFont;
          var param = GOOGLE_FONT_PARAM[ff];
          if (param) {
            var id = 'gfont-' + ff.replace(/\s+/g, '-');
            if (!document.getElementById(id)) {
              var link = document.createElement('link');
              link.id = id;
              link.rel = 'stylesheet';
              link.href = 'https://fonts.googleapis.com/css2?family=' + param + '&display=swap';
              document.head.appendChild(link);
            }
          }
          el.style.setProperty('--font-sans', quoteFontName(ff) + ', ' + SANS_FALLBACK);
        }
        try {
          var raw = localStorage.getItem('ui-storage');
          if (!raw) return;
          var data = JSON.parse(raw);
          var state = data && data.state;
          if (!state) return;
          var el = document.documentElement;
          var scheme = state.colorScheme;
          var isDark = scheme === 'dark' || (scheme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            el.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0f172a');
          } else {
            el.classList.remove('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#ffffff');
          }
          var fontSize = state.fontSize;
          if (fontSize) el.dataset.textSize = fontSize;
          applyFontFromState(state);
          var pc = state.primaryColor;
          if (pc && colorMap[pc]) {
            var v = colorMap[pc];
            el.style.setProperty('--primary', v);
            el.style.setProperty('--ring', v);
            el.style.setProperty('--secondary-foreground', v);
            el.style.setProperty('--accent-foreground', v);
            el.style.setProperty('--color-primary', 'hsl(' + v + ')');
            el.style.setProperty('--color-ring', 'hsl(' + v + ' / 0.5)');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Logo / favicon / PWA từ ui-storage (Thông tin tổ chức) trước khi React mount -->
    <script>
      (function() {
        var DEFAULT_LOGO = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKffuRSheGugfycCmEm46856oXbHMXKHiOjg&s';
        var DEFAULT_NAME = 'mangiico';
        var DEFAULT_DESC = 'phần mềm quản trị Erp';
        function guessMime(url) {
          if (!url) return '';
          if (url.indexOf('data:image/png') === 0) return 'image/png';
          if (url.indexOf('data:image/jpeg') === 0 || url.indexOf('data:image/jpg') === 0) return 'image/jpeg';
          if (url.indexOf('data:image/webp') === 0) return 'image/webp';
          if (url.indexOf('data:image/svg') === 0) return 'image/svg+xml';
          var u = url.split('?')[0].toLowerCase();
          if (u.slice(-4) === '.png') return 'image/png';
          if (u.slice(-4) === '.jpg' || u.slice(-5) === '.jpeg') return 'image/jpeg';
          if (u.slice(-5) === '.webp') return 'image/webp';
          if (u.slice(-4) === '.svg') return 'image/svg+xml';
          return '';
        }
        function setMeta(prop, content, isName) {
          var sel = isName ? 'meta[name="' + prop + '"]' : 'meta[property="' + prop + '"]';
          var el = document.querySelector(sel);
          if (!el) {
            el = document.createElement('meta');
            if (isName) el.setAttribute('name', prop);
            else el.setAttribute('property', prop);
            document.head.appendChild(el);
          }
          el.content = content;
        }
        function setIcon(rel, href, mime) {
          var el = document.querySelector('link[rel="' + rel + '"]');
          if (!el) {
            el = document.createElement('link');
            el.rel = rel;
            document.head.appendChild(el);
          }
          el.href = href;
          if (mime) el.type = mime;
          else el.removeAttribute('type');
        }
        try {
          var raw = localStorage.getItem('ui-storage');
          var ci = null;
          if (raw) {
            var parsed = JSON.parse(raw);
            ci = parsed.state && parsed.state.companyInfo;
          }
          var OLD_NAMES = { '5f edu': 1, '5f template': 1, 'mangiico': 1, 'mangiico erp': 1 };
          var OLD_DESCS = {
            'số hóa doanh nghiệp hiệu quả': 1,
            'hệ thống quản trị': 1,
            'hệ thống quản trị doanh nghiệp': 1,
            'hệ thống nền tảng số': 1
          };
          var rawName = (ci && ci.appName && String(ci.appName).trim()) || '';
          var rawDesc = (ci && ci.appDescription != null) ? String(ci.appDescription).trim() : '';
          var name = OLD_NAMES[rawName.toLowerCase()] ? DEFAULT_NAME : (rawName || DEFAULT_NAME);
          var desc = OLD_DESCS[rawDesc.toLowerCase()] ? DEFAULT_DESC : (rawDesc || DEFAULT_DESC);
          var logo = (ci && ci.appLogo && String(ci.appLogo).trim()) || DEFAULT_LOGO;
          var title = desc ? name + ' - ' + desc : name;
          var mime = guessMime(logo);
          document.title = title;
          setIcon('icon', logo, mime);
          setIcon('apple-touch-icon', logo, mime);
          setMeta('og:title', title, false);
          setMeta('og:description', desc || name, false);
          setMeta('og:image', logo, false);
          setMeta('description', desc || name, true);
        } catch (e) {}
      })();
    </script>

}
</script>
